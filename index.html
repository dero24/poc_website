<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <title>Morphic Web — Instant AI Apps</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">Morphic Web</div>
    <div class="slogan">Instant AI Apps - Built to perfection!</div>
  </div>
  <div class="setup-card" id="setupCard">
    <form onsubmit="event.preventDefault(); initializeExperience();">
      <div class="api-input-group">
        <label for="apiKey">Groq API Key</label>
        <input type="password" id="apiKey" required autocomplete="off" placeholder="Paste your Groq API key">
        <small>Get free key: <a href="https://console.groq.com/" target="_blank">console.groq.com</a></small>
      </div>
      <button type="submit" class="start-btn">🚀 Start Building</button>
    </form>
  </div>
  <div style="display:none" class="interaction-zone" id="interactionZone">
    <div class="examples">
      <div class="examples-title">Try these:</div>
      <div class="examples-list">
        <button type="button" class="example-btn" onclick="useExamplePrompt('AI assistant chatbot with message history, typing indicator, and error handling')">AI Assistant Chatbot</button>
        <button type="button" class="example-btn" onclick="useExamplePrompt('Premium calculator with history, memory (M+, M-, MR, MC), keyboard support, and dark mode toggle')">Premium Calculator</button>
        <button type="button" class="example-btn" onclick="useExamplePrompt('Todo app with drag-and-drop, priorities, search, filters, and local storage persistence')">Todo Pro</button>
        <button type="button" class="example-btn" onclick="useExamplePrompt('Real-time Markdown editor with live preview, autosave, and export to HTML/Markdown')">Markdown Editor</button>
        <button type="button" class="example-btn" onclick="useExamplePrompt('Personal finance dashboard with budgets, charts, and monthly summaries (no backend)')">Finance Dashboard</button>
        <button type="button" class="example-btn" onclick="useExamplePrompt('Flashcard trainer with spaced repetition scheduling and progress stats')">Flashcard Trainer</button>
        <button type="button" class="example-btn" onclick="useExamplePrompt('Recipe finder UI that fetches from an API proxy, with filters and favorites (stub fetch if needed)')">Recipe Finder</button>
        <button type="button" class="example-btn" onclick="useExamplePrompt('AI code reviewer that takes pasted code and returns annotated suggestions using the selected model')">AI Code Reviewer</button>
      </div>
    </div>
    <div class="model-select">
      <label for="modelSelect">Groq Model</label>
      <select id="modelSelect" disabled>
        <option>Loading models...</option>
      </select>
    </div>
    <div class="stats">
      <div class="stat-card"><h3 id="interactionCount">0</h3><p>Apps Built</p></div>
      <div class="stat-card"><h3 id="elementsCreated">0</h3><p>Components</p></div>
      <div class="stat-card"><h3 id="adaptations">0</h3><p>Live Apps</p></div>
    </div>
    <div class="user-input-area">
      <textarea id="userIntent" placeholder="Describe any app: game, calculator, todo list, AI assistant... I'll build it instantly!"></textarea>
      <button type="button" onclick="generateInterface()" class="generate-btn">✨ Build App</button>
    </div>
    <div class="generated-content" id="generatedContent">
      <p style="color:#68a;text-align:center;">Your app appears here instantly!</p>
    </div>
    <div class="history-log" id="historyLog"></div>
  </div>
  <div class="branding">Morphic Web &copy; 2026</div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
